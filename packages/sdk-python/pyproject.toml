[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ureg"
version = "0.0.0"
description = "Optional runtime instrumentation for UReg, the universal automation registry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ureg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
